<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="ИИ-тренажёр для подготовки к олимпиадам по математике и физике: проверенные варианты задач, подсказки по шагам, проверка размерности." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Шрифт грузится, не блокируя страницу: без интернета приложение не ждёт его. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Картинка при отправке ссылки в мессенджерах. Адрес абсолютный: при смене адреса сайта поменять его здесь. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="olymp-trainer" />
    <meta property="og:description" content="ИИ-тренажёр для подготовки к олимпиадам по математике и физике: проверенные задачи, подсказки по шагам, разбор." />
    <meta property="og:image" content="https://olymp-trainer.onrender.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>olymp-trainer</title>
    <script>
      // Тема до отрисовки, чтобы не мелькал белый экран: сохранённая или как в системе.
      try {
        var t = localStorage.getItem('olymp-theme')
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
