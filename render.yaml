# Деплой на Render (Blueprint): New → Blueprint → выбрать этот репозиторий.
# Подробная инструкция — docs/DEPLOY.md.
services:
  - type: web
    name: olymp-trainer
    runtime: docker
    # Бесплатный тариф: база (аккаунты, прогресс) стирается при обновлении и перезапуске сервиса,
    # после 15 минут без посетителей сайт засыпает. Чтобы хранить базу постоянно — plan: starter
    # и блок disk (см. docs/DEPLOY.md).
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Render стоит прокси перед приложением: IP ученика берём из X-Forwarded-For (лимиты по адресу).
      - key: TRUST_PROXY
        value: "1"
      # На бесплатном тарифе 512 МБ памяти — не больше 2 запусков кода одновременно.
      - key: SANDBOX_MAX_PARALLEL
        value: "2"
      # Ключи вводятся вручную в панели Render при создании (в git их нет).
      - key: OLYMP_ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
