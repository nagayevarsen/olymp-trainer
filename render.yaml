# Деплой на Render (Blueprint): New → Blueprint → выбрать этот репозиторий.
# Подробная инструкция — docs/DEPLOY.md.
services:
  - type: web
    name: olymp-trainer
    runtime: docker
    # Платный тариф: сайт не засыпает, а база лежит на постоянном диске и не стирается при обновлении.
    plan: starter
    region: frankfurt
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # База на постоянном диске.
      - key: DB_PATH
        value: /var/data/app.db
      # Render стоит прокси перед приложением: IP ученика берём из X-Forwarded-For (лимиты по адресу).
      - key: TRUST_PROXY
        value: "1"
      # 512 МБ памяти — не больше 2 запусков кода одновременно.
      - key: SANDBOX_MAX_PARALLEL
        value: "2"
      # Ключи вводятся вручную в панели Render при создании (в git их нет).
      - key: OLYMP_ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
