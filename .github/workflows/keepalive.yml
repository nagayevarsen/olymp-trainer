# Не даёт сайту на бесплатном Render засыпать (он засыпает через 15 минут без посетителей,
# а при пробуждении стирается база с аккаунтами). GitHub заходит на сайт каждые 5 минут.
# Расписание GitHub примерное: запуск может задержаться на несколько минут.
name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Зайти на сайт
        run: |
          for i in 1 2 3; do
            if curl -fsS -m 90 https://olymp-trainer.onrender.com/api/health; then exit 0; fi
            sleep 10
          done
          echo "Сайт не ответил" && exit 1
